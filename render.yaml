services:
  - type: web
    name: mon-univers-tech
    runtime: node
    plan: free
    branch: feature/mon-univers-tech-v2
    autoDeployTrigger: off
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SEO_INDEXING
        value: "false"
      - key: OPENAI_ENABLED
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
